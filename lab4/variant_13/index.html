<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вариант 13 — Расчёт доставки</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>Расчёт доставки</h1>
  <form id="deliveryForm" novalidate>
    <div class="field" data-field="city">
      <label for="city">Город получателя</label>
      <select id="city">
        <option value="" data-price="0">Выберите город</option>
        <option data-price="1200">Алматы</option>
        <option data-price="1500">Астана</option>
        <option data-price="1800">Шымкент</option>
        <option data-price="2600">Актобе</option>
      </select>
      <span class="error"></span>
    </div>
    <div class="field" data-field="weight">
      <label for="weight">Вес посылки, кг</label>
      <input id="weight" type="number" step="0.1" placeholder="например, 2.5">
      <span class="error"></span>
    </div>
    <fieldset class="field" data-field="kind">
      <legend>Тип доставки</legend>
      <label class="opt"><input type="radio" name="kind" value="Стандарт (3–5 дней)" data-mult="1"> Стандарт, 3–5 дней</label>
      <label class="opt"><input type="radio" name="kind" value="Экспресс (1–2 дня)" data-mult="1.8"> Экспресс, 1–2 дня (×1,8)</label>
      <span class="error"></span>
    </fieldset>
    <button type="submit">Рассчитать</button>
  </form>
  <div id="result" class="result"></div>
</main>
<script src="script.js"></script>
</body>
</html>
